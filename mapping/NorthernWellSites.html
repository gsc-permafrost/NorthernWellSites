<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Add a polygon to a map using a GeoJSON source</title>
<meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
<link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
<!-- Import Turf Module - Needed to calculate bounding boxes -->
<script src='https://api.mapbox.com/mapbox.js/plugins/turf/v2.0.2/turf.min.js'></script>
<style>
	body { margin: 0; padding: 0;}
	#map { position: absolute; top: 0; bottom: 0; width: 100%;}
	#map canvas {cursor: crosshair;}
  
    .action_menu {
        text-align: center;
        background: #fff;
        position: absolute;
        z-index: 1;
        bottom: 2%;
        right: 10px;
        border: #3887be;
        border-radius: 3px;
        display: flex;
        max-height: 10%;
        min-width: 75px;
        max-width: 100%;
        border: 1px solid rgba(0, 0, 0, 0.4);
        font-family: 'Open Sans', sans-serif; 
        }

    .btn {
        font: bold 12px/20px 'Helvetica Neue', Arial, Helvetica, sans-serif;
        background-color: #3386c0;
        color: #fff;
        position: relative;
        z-index: 1;
        border-width: 1px;
        display: block;
        cursor: pointer;
        padding: 8px;
        border-color: black;
        width: 100%;
        /* min-width: 5%; */
    }
    .btn:hover {
        background-color: #4ea0da;
    }
    .btn:first-child{
        margin-left: 0;
    }    
    
    .mapboxgl-popup {
        padding: 1%;
        max-width: 100% !important;
        min-width: 15%;
        font-size:2em;
        line-height:1.25em;
        }
    
    .mapboxgl-popup-content {
        width: 100%;
    }
        
    #layer_menu {
        background: #fff;
        position: absolute;
        z-index: 1;
        top: 10px;
        left: 10px;
        border-radius: 3px;
        max-width: 15%;
        min-width: 5%;
        border: 1px solid rgba(0, 0, 0, 0.4);
        font-family: 'Open Sans', sans-serif;
        }
              
    nav a {
        font-size: 13px;
        color: #404040;
        display: block;
        margin: 0;
        padding: 0;
        padding: 8px;
        text-decoration: none;
        border-bottom: 1px solid rgba(0, 0, 0, 0.25);
        text-align: center;
        }
        
    nav a:last-child {
        border: none;
        }
        
    nav a:hover {
        background-color: #03dbfc;
        color: #404040;
        }
        
    nav a.active {
        background-color: #3887be;
        color: #ffffff;
        }
        
    nav a.active:hover {
        background: #3074a4;
        color: #ffffff;
        }
</style>
</head>

<div id="map"></div>
<div class="action_menu"> 
    <button id="readme" class="btn">Read Me</button>
</div>

<button id="zoomto" class="btn-control">Zoom to sites</button>

    const FFP_Contour_Intervals = [];

	// Replace access token!
    mapboxgl.accessToken = 'dummy token';
  
    //  Custom mapStyle lest us use ESRI raster tiles
    const mapStyle = {
        version: 8,
        sources: {
        worldImagery: {
            type: "raster",
            tiles: ["https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"],
            tileSize: 256
            }
        },
        layers: [{
            id: "worldImagery",
            type: "raster",
            source: "worldImagery",
            minzoom: 0,
            maxzoom: 22
            }
        ]
    };

    //  Create the map - zoom and center are "arbitrary"
    const map = new mapboxgl.Map({
                container: 'map',
                zoom: 8,
                center: [-134,69.5], // starting position
                style: mapStyle,
                });

    var geolocate = new mapboxgl.GeolocateControl({

        enableHighAccuracy: true

    map.on('load', () => {
        // Add a data sources containing GeoJSON data.

        // Add a data source containing GeoJSON data.
        map.addSource('Site_Name', {
            'type': 'geojson',
            'data': pointData
        });
       
        map.addLayer({'id': 'Site_Name',
                'type': 'circle',
                'source': 'Site_Name',
                'filter': ['==', '$type', 'Point'],
                'layout': {
                // Make the layer visible by default.
                'visibility': 'visible'
                },
                'paint':{
                    'circle-radius': 5,
                    'circle-color':[
                        'match',
                        ['get','Data_Source'],
                        'OROGO', '#66c2a5', 'CER-GSC-Arktis', '#66c2a5', 'Basin', '#fc8d62', 'CER-GSC', '#8da0cb', 'GeoYukon', '#8da0cb', 'CER-OROGO', '#e78ac3', 'CER-Basin-Arktis', '#a6d854', 'CER-Arktis', '#a6d854', 'CER', '#ffd92f', 'CER-Basin', '#e5c494', 'Arktis', '#e5c494', 'CER-GSC-OROGO', '#b3b3b3', 'GSC-GeoYukon-Arktis', '#b3b3b3',
                        /* fallback */ '#000000'      // Default color
                    ],
                    "circle-stroke-width": 1,
                    "circle-stroke-color": 'black'
                }
               // 'paint': {
//                    'circle-radius': 3,
//                    'circle-color': ['interpolate-hcl', ['linear'], ['get', 'description'], LOWER_BOUND, 'blue', UPPER_BOUND, 'red']
//,
//                    "circle-stroke-width": 1,
//                    "circle-stroke-color": 'black'
                   // },
                });
    });


    map.on('click', 'Site_Name', (e) => {
            // Copy coordinates array.
            const coordinates = e.features[0].geometry.coordinates.slice();
            const description = '<b>'+e.features[0].properties.Name+'</b><br><br>'+e.features[0].properties.description;

            // Ensure that if the map is zoomed out such that multiple
            // copies of the feature are visible, the popup appears
            // over the copy being pointed to.
            if (['mercator', 'equirectangular'].includes(map.getProjection().name)) {
                while (Math.abs(e.lngLat.lng - coordinates[0]) > 180) {
                    coordinates[0] += e.lngLat.lng > coordinates[0] ? 360 : -360;
                }
            }

            new mapboxgl.Popup()
                .setLngLat(coordinates)
                .setHTML(description)
                .addTo(map);
        });

        
    let bbox = turf.extent(turf.buffer(pointData,.005));
        
    // fit zom to the bounding box of whichever layers are loaded
    function fit() {
        map.fitBounds(bbox, {maxZoom: 15});
        };

    fit();

    map.addControl(new mapboxgl.ScaleControl({position: 'bottom-right'}));
    
    // Call fit when clicking the zoomto button
    document.getElementById('zoomto').addEventListener('click', () => {
        fit()
    });
</script>
